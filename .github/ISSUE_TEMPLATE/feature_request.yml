name: Feature request
description: Suggest something the Start Testing SDK should do
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve
      description: Describe the situation, not just the solution. What were you doing when you wished this existed?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like to happen
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds you have tried
    validations:
      required: false
  - type: dropdown
    id: sdk
    attributes:
      label: Which SDK is this for
      options:
        - All of them
        - Swift (iPhone, iPad, Mac)
        - Python
        - .NET (Windows)
    validations:
      required: true
