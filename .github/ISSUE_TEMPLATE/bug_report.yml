name: Bug report
description: Something is not working the way the README says it should
labels: ["bug"]
body:
  - type: dropdown
    id: sdk
    attributes:
      label: Which SDK
      options:
        - Swift (iPhone, iPad, Mac)
        - Python
        - .NET (Windows)
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and version
      description: For example iOS 26.1, macOS 15.2, or Windows 11.
    validations:
      required: true
  - type: dropdown
    id: build
    attributes:
      label: Kind of build
      options:
        - Run from Xcode or a debugger
        - TestFlight or another beta channel
        - App Store or another production release
        - Not applicable
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SDK version or commit
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Error text or test output
      description: Paste any error text exactly as it appeared. Remove SDK keys, tokens, and anything private first.
      render: text
    validations:
      required: false
  - type: input
    id: assistive-tech
    attributes:
      label: Assistive technology, if relevant
      description: For example VoiceOver, NVDA, JAWS, a braille display, or voice control.
    validations:
      required: false
